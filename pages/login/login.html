<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BWamplerFit Admin Login</title>

    <link
        rel="stylesheet"
        href="../../assets/css/variables.css"
    >
    <link
        rel="stylesheet"
        href="../../assets/css/base.css"
    >
    <link
        rel="stylesheet"
        href="../../assets/css/layout.css"
    >
    <link
        rel="stylesheet"
        href="../../assets/css/components.css"
    >
    <link
        rel="stylesheet"
        href="./login.css?v=2"
    />
</head>

<body class="login-page">

    <main class="login">

        <section class="login__card">

            <div class="login__brand">

                <div class="admin-login__logo-wrap">
                    <img
                        src="../../assets/images/bwamplerfit-logo.png"
                        alt="BWamplerFit"
                        class="admin-login__logo"
                    />
                </div>

                <p class="login__eyebrow">
                    BWamplerFit
                </p>

                <h1 class="login__title">
                    Admin Dashboard
                </h1>

                <p class="login__intro">
                    Sign in to manage challenges,
                    participants, and progress.
                </p>

            </div>

            <form
                class="login__form"
                id="login-form"
            >

                <div class="form-field">

                    <label
                        for="email"
                        class="form-field__label"
                    >
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-field__input"
                        autocomplete="email"
                        required
                    >

                </div>

                <div class="form-field">

                    <label
                        for="password"
                        class="form-field__label"
                    >
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-field__input"
                        autocomplete="current-password"
                        required
                    >

                </div>

                <p
                    class="login__message"
                    id="login-message"
                    aria-live="polite"
                ></p>

                <button
                    type="submit"
                    class="login__button"
                    id="login-button"
                >
                    Sign In
                </button>

            </form>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" ></script>
    <script src="../../assets/js/config.js"></script>
    <script src="../../assets/js/supabase.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="./login.js"></script>

</body>

</html>
