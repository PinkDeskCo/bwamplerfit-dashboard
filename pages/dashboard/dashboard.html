            <aside
                class="admin-sidebar"
                id="admin-sidebar"
            ></aside>

        <!-- ==========================================
             Main Content
        =========================================== -->

        <main class="admin-main">

            <header class="dashboard-header">

                <div>

                    <p class="dashboard-header__eyebrow">
                        Overview
                    </p>

                    <h1 class="dashboard-header__title">
                        Challenges
                    </h1>

                    <p class="dashboard-header__intro">
                        Manage BWamplerFit challenges
                        and participant progress.
                    </p>

                </div>

            </header>


            <!-- ======================================
                 Summary
            ======================================= -->

            <section
                class="dashboard-summary"
                aria-label="Challenge summary"
            >

                <article class="summary-card">

                    <p class="summary-card__label">
                        Total Challenges
                    </p>

                    <p
                        class="summary-card__value"
                        id="total-challenges"
                    >
                        &mdash;
                    </p>

                </article>

                <article class="summary-card">

                    <p class="summary-card__label">
                        Active Challenges
                    </p>

                    <p
                        class="summary-card__value"
                        id="active-challenges"
                    >
                        &mdash;
                    </p>

                </article>

                <article class="summary-card">

                    <p class="summary-card__label">
                        Total Participants
                    </p>

                    <p
                        class="summary-card__value"
                        id="total-participants"
                    >
                        &mdash;
                    </p>

                </article>

            </section>


            <!-- ======================================
                 Challenge List
            ======================================= -->

           <section
                class="challenge-library"
                id="challenges"
            >

                <div
                    class="challenge-grid"
                    id="challenge-grid"
                >

                    <p class="challenge-grid__loading">
                        Loading challenges...
                    </p>

                </div>

            </section>
        </main>

    </div>
